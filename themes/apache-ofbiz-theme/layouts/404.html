{{ define "main" }}
<section id="content" class="fullWidth">
  <header class="headerPage">
    <div class="container clearfix">
      <div class="row">
        <h1 class="col-8">{{ .Title}}</h1>
        <div class="col-4" id="navTrail"> <a href="/" class="homeLink">home</a><span>/</span><span class="current">{{ .Title }}</span> </div>
      </div>
    </div>
  </header>
  <section>
    <div class="slice clearfix">
      <div class="container">
        <div class="row">
            <div class="col-5">
              
              <div class="imgWrapper"> <img src="/images/img-404.jpg" alt="404 image"/> </div>
              
            </div>
            <div class="col-7">
              <h2>{{ .Name }}</h2>
              <h3>{{ .Description }}</h3>
            </div>
          </section>
      </div>
    </div>
  </div>
</section>
{{ end }}
