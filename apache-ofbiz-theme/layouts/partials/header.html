<!-- header -->
<header id="mainHeader" class="clearfix">
  <div class="navbar navbar-fixed-top">
    <div class="navbar-inner">
      <div class="container"> 
        <a href="/" class="brand"><img src="/images/ofbiz_logo.png" alt="Apache OFBiz Logo"/></a>
        <nav id="mainMenu" class="clearfix">
          <ul>
            {{- $currentPage := .Page }}
            {{- range site.Menus.main }}
            {{ partial "nav-item.html" (dict "entry" . "page" $currentPage) }}
            {{ end }}
          </ul>
        </nav>
      </div>
    </div>
  </div>
</header>
