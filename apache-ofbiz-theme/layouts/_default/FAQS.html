{{ define "main" }}
<section id="content" class="fullWidth">
    <header class="headerPage">
      <div class="container clearfix">
        <div class="row">
          <h1 class="col-8">{{ .Params.title}}</h1>
          <div class="col-4" id="navTrail"> {{ partial "navtrail.html" . }} </div>
        </div>
      </div>
    </header>
<section>
    <div class="slice clearfix">
      <div class="container">
        <div class="row">
          <aside class="col-4" id="sidebar">
            <section id="widgetArea">
              <h3>Answers to common questions <br/>
                about Apache OFBiz</h3>
              <p>Please take a look at our FAQs</p>
            </section>
          </aside>
          <div class="col-8">
            <div class="accordion" id="accordionFaq">
              {{- $i := 0 }}
              {{- range .Params.faqs }}
              <div class="accordion-group">
                <div class="accordion-heading"> 
                  <a class="accordion-toggle" data-bs-toggle="collapse" data-bs-parent="#accordionFaq" href="#{{ .title }}">
                    <i class="{{ if eq $i 0 }}icon-down-circle{{ else }}icon-right-circle{{ end }}"></i> {{ .question }} 
                  </a> 
                </div>
                <div id="{{ .title }}" class="accordion-body collapse{{ if eq $i 0 }} show{{ end }}" data-bs-parent="#accordionFaq">
                  <div class="accordion-inner">
                    <p>{{ .answer }}</p>
                  </div>
                </div>
              </div>
              {{- $i = add $i 1 }}
              {{ end }}
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
  </section>
  {{ end }}
