# theme.toml for the local Apache OFBiz theme
name = "Apache Ofbiz Theme"
license = "Apache License 2.0"
licenselink = "https://github.com/apache/ofbiz-site/blob/master/LICENSE"
description = "Hugo-Theme for the Apache OFBiz website (Bootstrap 5.3)"
homepage = "https://ofbiz.apache.org/"
tags = ["blog", "portfolio", "bootstrap"]
features = ["bootstrap 5", "responsive", "menu", "shortcode"]
min_version = "0.164.0"

[author]
  name = "Apache OFBiz"
  homepage = "https://ofbiz.apache.org/"

# If porting an existing theme
[original]
  name = "Legacy"
  homepage = "https://ofbiz.apache.org/"
  repo = ""
